commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: '**/*.ts'
      run: pnpm exec oxlint {staged_files} --no-error-on-unmatched-pattern
    oxfmt:
      glob: '**/*.{json,md,yaml,ts}'
      run: pnpm exec oxfmt --check {staged_files}

pre-push:
  commands:
    build:
      run: pnpm build
